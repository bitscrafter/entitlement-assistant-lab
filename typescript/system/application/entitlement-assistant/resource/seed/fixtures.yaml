    account: iac_sys_grant_expiry
    name: grant-expiry
    description: Records the end of expired grants.
    roles:
      - entitlement-maintenance
  - identity: sys_approval_process
    account: iac_sys_approval_process
    name: approval-process
    description: Applies approved change requests and expires undecided approvals.
