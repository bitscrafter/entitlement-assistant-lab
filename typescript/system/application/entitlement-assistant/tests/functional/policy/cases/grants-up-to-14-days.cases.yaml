policy_key: grants-up-to-14-days
cases:
  - name: 14 days without approval
    given:
      context:
        duration_days: 14
        approval_granted: false
    then: true
  - name: 15 days without approval
    given:
      context:
        duration_days: 15
        approval_granted: false
    then: false
  - name: 15 days with approval
    given:
      context:
        duration_days: 15
        approval_granted: true
    then: true
